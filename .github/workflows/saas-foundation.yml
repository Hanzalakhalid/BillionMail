name: SaaS foundation

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: saas-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_USER: billionmail
          POSTGRES_PASSWORD: integration-secret
          POSTGRES_DB: billionmail_tenant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billionmail -d billionmail_tenant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: core
    env:
      BM_TEST_DB_PASSWORD: integration-secret
      BM_TEST_DB_USER: billionmail
      BM_TEST_DB_NAME: billionmail_tenant_test
      BM_TEST_DB_HOST: 127.0.0.1
      BM_TEST_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l internal/migrations internal/service/tenancy internal/service/platform internal/service/identity internal/service/queue internal/service/notifications internal/service/secrets internal/service/whatsappchannel internal/service/whatsappwebhook internal/service/database_initialization internal/service/redis_initialization internal/controller/companies internal/controller/identity internal/controller/health internal/controller/metawebhook internal/cmd api/companies api/identity cmd/saas-worker)"
      - name: Vet foundation packages
        run: go vet ./internal/migrations ./internal/service/tenancy ./internal/service/platform ./internal/service/identity ./internal/service/queue ./internal/service/notifications ./internal/service/secrets ./internal/service/whatsappchannel ./internal/service/whatsappwebhook ./internal/service/database_initialization ./internal/service/redis_initialization ./internal/controller/companies ./internal/controller/identity ./internal/controller/metawebhook ./internal/service/rbac ./internal/controller/rbac ./cmd/saas-worker
      - name: Unit and integration tests
        run: go test -count=1 ./internal/migrations ./internal/service/tenancy ./internal/service/platform ./internal/service/identity ./internal/service/queue ./internal/service/notifications ./internal/service/secrets ./internal/service/whatsappchannel ./internal/service/whatsappwebhook ./internal/service/database_initialization ./internal/service/redis_initialization ./internal/controller/companies ./internal/controller/identity ./internal/controller/metawebhook ./internal/service/rbac ./internal/controller/rbac
      - name: Marketing foundation checks
        run: |
          test -z "$(gofmt -l internal/service/projects internal/controller/projects api/projects internal/service/products internal/controller/products api/products internal/service/business internal/controller/business api/business internal/service/scheduler internal/service/integrations internal/service/objectstorage internal/service/assets internal/service/antivirus internal/controller/integrations internal/controller/assets api/assets cmd/scheduler cmd/media-worker cmd/storage-init)"
          go vet ./internal/service/projects ./internal/controller/projects ./api/projects/... ./api/products/... ./internal/service/products ./internal/controller/products ./internal/service/business ./internal/controller/business ./internal/service/scheduler ./internal/service/integrations ./internal/service/objectstorage ./internal/service/assets ./internal/service/antivirus ./internal/controller/integrations ./internal/controller/assets ./cmd/scheduler ./cmd/media-worker ./cmd/storage-init
          go test -count=1 ./internal/service/projects ./internal/controller/projects ./api/projects/... ./api/products/... ./internal/service/products ./internal/controller/products ./internal/service/business ./internal/controller/business ./internal/service/scheduler ./internal/service/integrations ./internal/service/objectstorage ./internal/service/assets ./internal/service/antivirus ./internal/controller/integrations ./internal/controller/assets
          go build -o /tmp/scheduler ./cmd/scheduler
          go build -o /tmp/saas-worker ./cmd/saas-worker
          go build -o /tmp/media-worker ./cmd/media-worker
          go build -o /tmp/storage-init ./cmd/storage-init

  compose-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.test.yml run --rm backend
      - if: always()
        run: docker compose -f compose.test.yml down --remove-orphans

  antivirus-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.test.yml -p billionmail-av-test --profile antivirus run --rm antivirus-check
      - if: always()
        run: docker compose -f compose.test.yml -p billionmail-av-test --profile antivirus down --remove-orphans

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: core/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test

  infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
