name: billionmail

services:
    pgsql-billionmail:
      image: postgres:17.4-alpine
      hostname: pgsql
      volumes:
        - ./postgresql-data:/var/lib/postgresql/data
        - ./postgresql-socket:/var/run/postgresql
      environment:
        - TZ=${TZ}
        - POSTGRES_DB=${DBNAME}
        - POSTGRES_USER=${DBUSER}
        - POSTGRES_PASSWORD=${DBPASS}
      restart: always
      ports:
        - "${SQL_PORT:-127.0.0.1:25432}:5432"
      networks:
        billionmail-network:
          aliases:
            - pgsql

    redis-billionmail:
      image: redis:7.4.2-alpine
      hostname: redis
      entrypoint: ["/bin/sh","/redis-conf.sh"]
      volumes:
        - ./redis-data:/data
        - ./conf/redis/redis-conf.sh:/redis-conf.sh
      restart: always
      ports:
        - "${REDIS_PORT:-127.0.0.1:26379}:6379"
      environment:
        - TZ=${TZ}
        - REDISPASS=${REDISPASS}
      sysctls:
        - net.core.somaxconn=4096
      networks:
        billionmail-network:
          aliases:
            - redis

    minio-billionmail:
      image: ${BILLIONMAIL_MINIO_IMAGE:-billionmail/minio:community-7aac2a2}
      build:
        context: .
        dockerfile: Dockerfiles/storage/Dockerfile
        target: server
        secrets: [host_ca]
      command: server /data --console-address :9001
      volumes:
        - ./media-data:/data
      environment:
        - MINIO_ROOT_USER=${DBUSER}
        - MINIO_ROOT_PASSWORD=${DBPASS}
      ports:
        - "${MINIO_API_PORT:-127.0.0.1:29000}:9000"
        - "${MINIO_CONSOLE_PORT:-127.0.0.1:29001}:9001"
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
        interval: 10s
        timeout: 5s
        retries: 12
      restart: always
      networks:
        billionmail-network:
          aliases:
            - minio

    minio-init-billionmail:
      image: billionmail/storage-init:marketing-local
      build:
        context: .
        dockerfile: Dockerfiles/storage/Dockerfile
        target: init
        secrets: [host_ca]
      depends_on:
        minio-billionmail:
          condition: service_healthy
      environment:
        - MEDIA_BUCKET=marketing-assets
        - MEDIA_REGION=us-east-1
        - MEDIA_ENDPOINT=http://minio:9000
        - MEDIA_ACCESS_KEY=${DBUSER}
        - MEDIA_SECRET_KEY=${DBPASS}
        - MEDIA_PATH_STYLE=true
      networks:
        billionmail-network:
          aliases:
            - minio-init

    rspamd-billionmail:
      image: billionmail/rspamd:1.2
      hostname: rspamd
      depends_on:
        - redis-billionmail
      environment:
        - TZ=${TZ}
        - REDISPASS=${REDISPASS}
        - RETENTION_DAYS=${RETENTION_DAYS:-7}
      volumes:
        - ./conf/rspamd/local.d:/etc/rspamd/local.d
        - ./conf/rspamd/statistic.conf:/etc/rspamd/statistic.conf
        - ./conf/rspamd/rspamd.conf:/etc/rspamd/rspamd.conf 
        - ./rspamd-data:/var/lib/rspamd
        - ./logs/rspamd:/var/log/rspamd
      restart: always
      networks:
        billionmail-network:
          aliases:
            - rspamd

    dovecot-billionmail:
      image: billionmail/dovecot:1.6
      hostname: dovecot
      depends_on:
        - pgsql-billionmail
        - redis-billionmail
      cap_add:
        - NET_BIND_SERVICE
      volumes:
        - ./conf/dovecot/conf.d:/etc/dovecot/conf.d
        - ./conf/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf
        - ./conf/dovecot/rsyslog.conf:/etc/rsyslog.conf
        - ./logs/dovecot:/var/log/mail
        - ./ssl:/etc/ssl/mail
        - ./ssl-self-signed:/etc/ssl/ssl-self-signed
        - ./vmail-data:/var/vmail
        - ./rspamd-data:/var/lib/rspamd
        - ./postgresql-socket:/var/run/postgresql
      environment:
        - DBNAME=${DBNAME}
        - DBUSER=${DBUSER}
        - DBPASS=${DBPASS}
        - TZ=${TZ}
        - BILLIONMAIL_HOSTNAME=${BILLIONMAIL_HOSTNAME}
        - REDISPASS=${REDISPASS}
        - RETENTION_DAYS=${RETENTION_DAYS:-7}
      ports:
        - "${IMAP_PORT:-143}:143"
        - "${IMAPS_PORT:-993}:993"
        - "${POP_PORT:-110}:110"
        - "${POPS_PORT:-995}:995"
      restart: always
      ulimits:
        nproc: 65535
        nofile:
          soft: 20000
          hard: 40000
      networks:
        billionmail-network:
          aliases:
            - dovecot

    postfix-billionmail:
      image: billionmail/postfix:1.6
      hostname: postfix
      depends_on:
        pgsql-billionmail:
          condition: service_started
      volumes:
        - ./conf/postfix/main.cf:/etc/postfix/main.cf
        - ./conf/postfix/master.cf:/etc/postfix/master.cf
        - ./conf/postfix/conf:/etc/postfix/conf
        - ./conf/postfix/sql:/etc/postfix/sql
        - ./conf/postfix/rsyslog.conf:/etc/rsyslog.conf
        - ./logs/postfix:/var/log/mail
        - ./ssl:/etc/ssl/mail
        - ./postfix-data:/var/spool/postfix
        - ./rspamd-data:/var/lib/rspamd
        - ./postgresql-socket:/var/run/postgresql
      environment:
        - TZ=${TZ}
        - DBNAME=${DBNAME}
        - DBUSER=${DBUSER}
        - DBPASS=${DBPASS}
        - REDISPASS=${REDISPASS}
        - BILLIONMAIL_HOSTNAME=${BILLIONMAIL_HOSTNAME}
        - RETENTION_DAYS=${RETENTION_DAYS:-7}
      cap_add:
        - NET_BIND_SERVICE
      ports:
        - "${SMTP_PORT:-25}:25"
        - "${SMTPS_PORT:-465}:465"
        - "${SUBMISSION_PORT:-587}:587"
      restart: always
      networks:
        billionmail-network:
          aliases:
            - postfix


    webmail-billionmail:
      image: roundcube/roundcubemail:1.6.11-fpm-alpine
      hostname: roundcube
      depends_on:
        - pgsql-billionmail
        - dovecot-billionmail
        - postfix-billionmail
      volumes:
        - ./webmail-data:/var/www/html
        - ./conf/webmail/mime.types:/var/roundcube/config/mime.types
        - ./conf/webmail:/var/roundcube/config
        - ./conf/php:/usr/local/etc
        - ./php-sock/:/var/run/
      environment:
        - TZ=${TZ}
        - ROUNDCUBEMAIL_DB_TYPE=pgsql
        - ROUNDCUBEMAIL_DB_HOST=pgsql
        - ROUNDCUBEMAIL_DB_NAME=${DBNAME}
        - ROUNDCUBEMAIL_DB_USER=${DBUSER}
        - ROUNDCUBEMAIL_DB_PASSWORD=${DBPASS}
        - ROUNDCUBEMAIL_DEFAULT_HOST=dovecot
        - ROUNDCUBEMAIL_DEFAULT_PORT=${IMAP_PORT:-143}
        - ROUNDCUBEMAIL_SMTP_SERVER=postfix
        - ROUNDCUBEMAIL_SMTP_PORT=${SMTP_PORT:-25}
        - ROUNDCUBEMAIL_REQUEST_PATH=/roundcube
      restart: always
      networks:
        billionmail-network:
          aliases:
            - webmail

    core-billionmail:
      image: ${BILLIONMAIL_CORE_IMAGE:-billionmail/core:marketing-local}
      build:
        context: .
        dockerfile: Dockerfiles/core/Dockerfile.source
        secrets: [host_ca]
      hostname: core-manage
      depends_on:
        - pgsql-billionmail
      volumes:
        - ./ssl:/etc/ssl/mail
        - ./ssl-self-signed:/etc/ssl/ssl-self-signed
        - ./conf/core/fail2ban/filter.d:/etc/fail2ban/filter.d
        - ./conf/core/fail2ban/jail.d:/etc/fail2ban/jail.d
        - ./logs/fail2ban:/var/log/fail2ban
        - ./postgresql-socket:/opt/billionmail/postgresql-socket
        - ./php-sock:/opt/billionmail/php-sock
        - ./rspamd-data:/opt/billionmail/rspamd-data
        - ./webmail-data:/opt/billionmail/webmail-data
        - ./.env:/opt/billionmail/.env
        - ./conf:/opt/billionmail/conf
        - ./logs:/opt/billionmail/logs
        - ./logs/core:/opt/billionmail/core/logs
        - ./core-data:/opt/billionmail/core/data
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - ./vmail-data:/opt/billionmail/vmail-data
      environment:
        - TZ=${TZ}
        - FAIL2BAN_INIT=${FAIL2BAN_INIT:-y}
        - SAAS_LOCAL_MASTER_KEY=${SAAS_LOCAL_MASTER_KEY:-}
        - MEDIA_BUCKET=marketing-assets
        - MEDIA_REGION=us-east-1
        - MEDIA_ENDPOINT=http://minio:9000
        - MEDIA_PUBLIC_ENDPOINT=${MEDIA_PUBLIC_ENDPOINT:-http://localhost:29000}
        - MEDIA_ACCESS_KEY=${DBUSER}
        - MEDIA_SECRET_KEY=${DBPASS}
        - MEDIA_PATH_STYLE=true
      cap_add:
        - NET_BIND_SERVICE
        - NET_ADMIN
        - NET_RAW
      ports:
        - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
        - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      restart: always
      networks:
        billionmail-network:
          aliases:
            - core

    clamav-billionmail:
      image: ${CLAMAV_IMAGE:-clamav/clamav:1.5}
      volumes:
        - clamav-signatures:/var/lib/clamav
      restart: always
      networks:
        billionmail-network:
          aliases:
            - clamav

    media-worker-billionmail:
      image: ${BILLIONMAIL_MEDIA_IMAGE:-billionmail/media:marketing-local}
      build:
        context: .
        dockerfile: Dockerfiles/media/Dockerfile
        secrets: [host_ca]
      depends_on:
        - pgsql-billionmail
        - redis-billionmail
        - minio-init-billionmail
        - clamav-billionmail
      environment:
        - TZ=${TZ}
        - DBNAME=${DBNAME}
        - DBUSER=${DBUSER}
        - DBPASS=${DBPASS}
        - DB_HOST=pgsql
        - DB_PORT=5432
        - REDIS_ADDR=redis:6379
        - REDISPASS=${REDISPASS}
        - REDISDB=${REDISDB:-1}
        - CLAMD_ADDR=clamav:3310
        - MEDIA_BUCKET=marketing-assets
        - MEDIA_REGION=us-east-1
        - MEDIA_ENDPOINT=http://minio:9000
        - MEDIA_PUBLIC_ENDPOINT=${MEDIA_PUBLIC_ENDPOINT:-http://localhost:29000}
        - MEDIA_ACCESS_KEY=${DBUSER}
        - MEDIA_SECRET_KEY=${DBPASS}
        - MEDIA_PATH_STYLE=true
      healthcheck:
        test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8082/healthz"]
        interval: 15s
        timeout: 6s
        retries: 3
        start_period: 180s
      restart: always
      networks:
        billionmail-network:
          aliases:
            - media-worker

    scheduler-billionmail:
      image: ${BILLIONMAIL_CORE_IMAGE:-billionmail/core:marketing-local}
      pull_policy: never
      entrypoint: []
      command: ["/opt/billionmail/core/scheduler"]
      working_dir: /opt/billionmail/core
      depends_on:
        - pgsql-billionmail
      volumes:
        - ./postgresql-socket:/opt/billionmail/postgresql-socket
        - ./.env:/opt/billionmail/.env:ro
      environment:
        - TZ=${TZ}
        - SCHEDULER_HEALTH_ADDR=:8081
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
        interval: 10s
        timeout: 5s
        retries: 3
        start_period: 60s
      restart: always
      networks:
        billionmail-network:
          aliases:
            - scheduler

    saas-worker-billionmail:
      image: ${BILLIONMAIL_CORE_IMAGE:-billionmail/core:marketing-local}
      pull_policy: never
      entrypoint: []
      command: ["/opt/billionmail/core/saas-worker"]
      working_dir: /opt/billionmail/core
      depends_on:
        - pgsql-billionmail
        - redis-billionmail
        - postfix-billionmail
      volumes:
        - ./postgresql-socket:/opt/billionmail/postgresql-socket
        - ./.env:/opt/billionmail/.env:ro
      environment:
        - TZ=${TZ}
        - REDIS_ADDR=redis:6379
        - REDISPASS=${REDISPASS}
        - REDISDB=${REDISDB:-1}
        - SAAS_PUBLIC_URL=${SAAS_PUBLIC_URL:-}
        - SAAS_FROM_EMAIL=${SAAS_FROM_EMAIL:-noreply@localhost}
        - SAAS_SMTP_ADDR=postfix:25
        - SAAS_LOCAL_MASTER_KEY=${SAAS_LOCAL_MASTER_KEY:-}
        - MEDIA_BUCKET=marketing-assets
        - MEDIA_REGION=us-east-1
        - MEDIA_ENDPOINT=http://minio:9000
        - MEDIA_PUBLIC_ENDPOINT=${MEDIA_PUBLIC_ENDPOINT:-http://localhost:29000}
        - MEDIA_ACCESS_KEY=${DBUSER}
        - MEDIA_SECRET_KEY=${DBPASS}
        - MEDIA_PATH_STYLE=true
      restart: always
      networks:
        billionmail-network:
          aliases:
            - saas-worker


secrets:
  host_ca:
    file: ${BILLIONMAIL_BUILD_CA_FILE:-./core/test/certs/.gitkeep}

volumes:
  clamav-signatures:

networks:
  billionmail-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-billionmail
    ipam:
      driver: default
      config:
        - subnet: ${IPV4_NETWORK:-172.66.1}.0/24

